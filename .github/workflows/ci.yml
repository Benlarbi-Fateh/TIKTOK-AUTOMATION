name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          RUN_NETWORK_TESTS: '0'
          RUN_RENDER_TESTS: '0'
          RUN_PUBLISH_TESTS: '0'
        run: |
          pytest -q

  integration:
    if: ${{ secrets.PUBLISH_SANDBOX_API_KEY != '' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (with extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # extras may include platform-specific packages; don't fail the job if unavailable
          pip install -r requirements-extra.txt || true
      - name: Run gated integration tests
        env:
          RUN_PUBLISH_TESTS: '1'
          PUBLISH_SANDBOX_API_KEY: ${{ secrets.PUBLISH_SANDBOX_API_KEY }}
          PUBLISH_SANDBOX_API_BASE: ${{ secrets.PUBLISH_SANDBOX_API_BASE }}
          ALLOW_REMOTE_CLEANUP: ${{ secrets.ALLOW_REMOTE_CLEANUP }}
        run: |
          pytest -q tests/integration -k publish | tee pytest-integration.log
      - name: Upload pytest integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration-log
          path: pytest-integration.log
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install pytest requests feedparser python-dotenv

      - name: Run tests
        run: |
          pytest -q
